<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 290" width="440" height="290" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title id="t">A Physarum agent and its three sensors</title>
  <desc id="d">An agent pointing up with left, centre and right sensors ahead of it. The right sensor sits on a trail and smells strongest.</desc>
  <rect width="440" height="290" rx="8" fill="#f6f4ee"/>

  <!-- trail passing through the right sensor -->
  <path d="M 212 30 C 258 92 222 176 290 250" fill="none" stroke="#e3d3a3" stroke-width="16" stroke-linecap="round" opacity="0.8"/>

  <!-- sensor rays -->
  <g stroke="#8a8578" stroke-width="1.5" stroke-dasharray="4 4" fill="none">
    <line x1="170" y1="250" x2="105" y2="137.4"/>
    <line x1="170" y1="250" x2="170" y2="120"/>
    <line x1="170" y1="250" x2="235" y2="137.4"/>
  </g>

  <!-- sensor angle -->
  <path d="M 170 190 A 60 60 0 0 1 200 198" fill="none" stroke="#8a8578" stroke-width="1.5"/>
  <text x="212" y="194" fill="#5c584f">sensor angle</text>

  <!-- sensor distance -->
  <g stroke="#b5b0a3" stroke-width="1" stroke-dasharray="2 3">
    <line x1="170" y1="120" x2="326" y2="120"/>
    <line x1="170" y1="250" x2="326" y2="250"/>
  </g>
  <line x1="320" y1="122" x2="320" y2="248" stroke="#8a8578" stroke-width="1.5"/>
  <line x1="314" y1="120" x2="326" y2="120" stroke="#8a8578" stroke-width="1.5"/>
  <line x1="314" y1="250" x2="326" y2="250" stroke="#8a8578" stroke-width="1.5"/>
  <text x="332" y="189" fill="#5c584f">sensor</text>
  <text x="332" y="205" fill="#5c584f">distance</text>

  <!-- sensors -->
  <circle cx="105" cy="137.4" r="9" fill="#f6f4ee" stroke="#8a8578" stroke-width="1.5"/>
  <circle cx="170" cy="120" r="9" fill="#f6f4ee" stroke="#8a8578" stroke-width="1.5"/>
  <circle cx="235" cy="137.4" r="9" fill="#c9ac5e" stroke="#8a7332" stroke-width="1.5"/>
  <g fill="#5c584f" text-anchor="middle">
    <text x="105" y="115">left</text>
    <text x="170" y="98">centre</text>
    <text x="235" y="115">right</text>
  </g>

  <!-- agent -->
  <path d="M 170 232 L 181 256 L 170 250 L 159 256 Z" fill="#8a7332"/>
  <text x="170" y="278" fill="#5c584f" text-anchor="middle">agent</text>
</svg>
